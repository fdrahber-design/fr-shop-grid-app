name: Build FR StorePilot installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Generate branded icon
        run: npm run assets:generate
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android
      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Prepare Android release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/FR-StorePilot-Android-1.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FR-StorePilot-Android-APK
          path: release/FR-StorePilot-Android-1.1.0.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate branded icon
        run: npm run assets:generate
      - name: Build portable Windows app
        run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: FR-StorePilot-Windows-EXE
          path: dist/FR-StorePilot-Windows-1.1.0.exe
          if-no-files-found: error

  release:
    name: Publish approved downloads
    if: github.event_name == 'pull_request' && github.head_ref == 'release-fr-storepilot'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create public FR StorePilot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.1.0 release/* --repo "${{ github.repository }}" --target "${{ github.event.pull_request.head.sha }}" --title "FR StorePilot 1.1.0" --notes "Official FR StorePilot Android and Windows downloads."
